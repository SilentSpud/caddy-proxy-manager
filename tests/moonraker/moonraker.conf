# Minimal Moonraker config for the real-Moonraker functional tests
# (tests/e2e/functional/forward-auth-real-moonraker.spec.ts).
#
# Runs without a Klipper socket (expected; Moonraker retries in the background
# but serves HTTP regardless). The API key is enforced for non-trusted
# clients — the Caddy container's IP is not in trusted_clients, so requests
# without X-Api-Key get 401 from Moonraker itself.
[server]
host: 0.0.0.0
port: 7125
enable_debug_logging: True

[authorization]
# api_key is no longer a supported config option in current Moonraker (the
# key lives in its database, retrievable by a trusted client via
# /access/api_key). Keep the Caddy container OUT of trusted_clients so
# Moonraker itself keeps enforcing the key for proxied requests.
# NOTE: Moonraker config lists are newline-separated continuation lines,
# NOT YAML-style "- item" entries.
trusted_clients:
    127.0.0.1
    ::1
force_logins: False
