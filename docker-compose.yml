services:
  web:
    container_name: caddy-proxy-manager-web
    image: ghcr.io/silentspud/caddy-proxy-manager/web:latest
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        # User and group IDs for rootless operation
        # Match your host user to avoid permission issues: id -u / id -g
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # production enforces password security
      NODE_ENV: production

      # Required, and unique per instance. Generate with: openssl rand -base64 32
      SESSION_SECRET: ${SESSION_SECRET:?ERROR - SESSION_SECRET is required}

      CADDY_API_URL: ${CADDY_API_URL:-http://caddy:2019}

      # Where generated certificates are written. Defaults to <workdir>/data/certs.
      CERTS_DIRECTORY: ${CERTS_DIRECTORY:-}

      # Public URL this instance is reached at.
      BASE_URL: ${BASE_URL:-http://localhost:3000}

      # PostgreSQL only. Points at the postgres service below unless you override it with your
      # own server; the database must already exist. An existing SQLite file is migrated through
      # the in-app migration flow, not by pointing this at it.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-cpm}:${POSTGRES_PASSWORD:?ERROR - POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-cpm}}

      # Connections the database pool may open. The real default, not `${VAR:-}`: it is read as
      # Number(), which turns the empty string that form produces into 0.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

      NEXTAUTH_URL: ${BASE_URL:-http://localhost:3000}

      # Renames the app in the sidebar, login card, and page titles.
      APP_NAME: ${APP_NAME:-}

      # Users without an icon fall back to Gravatar, which their browser fetches directly.
      # Set false to disable it and lock the Settings toggle.
      AVATAR_GRAVATAR: ${AVATAR_GRAVATAR:-true}

      # Required unless AUTH_DISABLE_LOCAL_USERS=true. Must be 12+ chars with upper,
      # lower, digit and special, or the app refuses to start.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Let new users sign themselves up.
      AUTH_ALLOW_SELF_REGISTRATION: ${AUTH_ALLOW_SELF_REGISTRATION:-false}
      AUTH_ALLOW_OAUTH_REGISTRATION: ${AUTH_ALLOW_OAUTH_REGISTRATION:-false}

      # Let the IdP's claims set a new user's role/status. When false, OAuth-created
      # accounts are forced to user/active no matter what the IdP sends.
      AUTH_ALLOW_OAUTH_ROLE_FROM_CLAIMS: ${AUTH_ALLOW_OAUTH_ROLE_FROM_CLAIMS:-false}

      # OIDC-only: no local accounts and no bootstrap admin. Enable only once OAuth works.
      AUTH_DISABLE_LOCAL_USERS: ${AUTH_DISABLE_LOCAL_USERS:-false}

      # Only behind a proxy that rewrites Host, and only when BASE_URL cannot cover it.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}

      # Force a reset for users still on a pre-argon2id bcrypt hash. Leave empty to let
      # the Settings -> Security toggle decide; setting it here locks that toggle.
      AUTH_REQUIRE_PASSWORD_CHANGE_ON_LEGACY_HASH: ${AUTH_REQUIRE_PASSWORD_CHANGE_ON_LEGACY_HASH:-}

      # Better Auth request rate limiting, and the separate login throttle.
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-60}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MS: ${LOGIN_WINDOW_MS:-300000}
      LOGIN_BLOCK_MS: ${LOGIN_BLOCK_MS:-900000}

      # Optional OAuth2/OIDC — Authentik, Authelia, Keycloak, and similar.
      OAUTH_ENABLED: ${OAUTH_ENABLED:-false}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME:-OAuth2}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_AUTHORIZATION_URL: ${OAUTH_AUTHORIZATION_URL:-}
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-}
      OAUTH_USERINFO_URL: ${OAUTH_USERINFO_URL:-}
      OAUTH_ALLOW_AUTO_LINKING: ${OAUTH_ALLOW_AUTO_LINKING:-false}
      OAUTH_SCOPES: ${OAUTH_SCOPES:-}

      # Group-based roles. Either name each role's groups below (comma-separated, any one
      # grants it), or set a prefix to derive <prefix>Admin, <prefix>User and <prefix>Viewer.
      OAUTH_ROLE_MAPPING: ${OAUTH_ROLE_MAPPING:-false}
      OAUTH_GROUPS_CLAIM: ${OAUTH_GROUPS_CLAIM:-}
      OAUTH_GROUP_PREFIX: ${OAUTH_GROUP_PREFIX:-}
      OAUTH_ADMIN_GROUP: ${OAUTH_ADMIN_GROUP:-}
      OAUTH_USER_GROUP: ${OAUTH_USER_GROUP:-}
      OAUTH_VIEWER_GROUP: ${OAUTH_VIEWER_GROUP:-}
      OAUTH_DEFAULT_ROLE: ${OAUTH_DEFAULT_ROLE:-}
      OAUTH_SYNC_GROUPS: ${OAUTH_SYNC_GROUPS:-false}

      # Optional analytics. Omit CLICKHOUSE_PASSWORD to disable; to enable, also start the
      # clickhouse service with: docker compose --profile clickhouse up -d
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cpm}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      # Days of analytics kept before deletion.
      CLICKHOUSE_RETENTION_DAYS: ${CLICKHOUSE_RETENTION_DAYS:-30}
    group_add:
      - "${CADDY_GID:-10000}"  # caddy's GID, so web can write /logs
    volumes:
      - caddy-manager-data:/app/data
      - geoip-data:/usr/share/GeoIP:ro,z
      # Caddy's logs are read by the agent now, not here. Still mounted because the controller
      # generates the log configuration and an operator reaching for them expects them present.
      - caddy-logs:/logs
      - acme-ca:/acme-ca
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "/app/cpm-server", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    container_name: caddy-proxy-manager-caddy
    image: ghcr.io/silentspud/caddy-proxy-manager/caddy:latest
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
      args:
        # Match your host user to avoid permission issues: id -u / id -g
        PUID: ${PUID:-10000}
        PGID: ${PGID:-10000}
    restart: unless-stopped
    ports:
      - "80:80"
      - "80:80/udp"
      - "443:443"
      - "443:443/udp"
      # Admin API. Internal-only by default; publish it at your own risk.
      # - "2019:2019"
      # Metrics for Prometheus/Grafana, once enabled in Settings.
      # - "9090:9090"
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-caddyproxymanager.com}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/logs
      - geoip-data:/usr/share/GeoIP:ro,z
      - acme-ca:/acme-ca:ro
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Restricts the Docker API surface reachable by the agent.
  docker-socket-proxy:
    container_name: caddy-proxy-manager-docker-proxy
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      NETWORKS: 1
      VOLUMES: 1
      IMAGES: 1
      SECRETS: 0
      # Allows recompiling Caddy when the module selection changes. Set 0 to disable the
      # "Rebuild Caddy" button; everything else keeps working.
      BUILD: 1
      # Deny everything else by default
      EXEC: 0
      SWARM: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  # Recreates the caddy container for the two changes a reload cannot apply:
  # L4 port changes and Caddy module selection.
  agent:
    container_name: caddy-proxy-manager-agent
    image: ghcr.io/silentspud/caddy-proxy-manager/agent:latest
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COMPOSE_DIR: /compose
      # standalone listens on a socket on the shared volume, which is how the controller in this
      # same stack reaches it. `managed` listens on AGENT_PORT and prints a pairing code instead —
      # for an agent on a different host from its controller.
      AGENT_MODE: ${AGENT_MODE:-standalone}
      AGENT_PORT: ${AGENT_PORT:-3100}
      # Every Caddy admin call the controller makes is proxied through the agent, because the
      # agent is the only thing that knows where its Caddy is. This is that address.
      CADDY_API_URL: ${CADDY_API_URL:-http://caddy:2019}
      # Analytics: the agent parses this host's Caddy logs and writes the events itself, using
      # credentials the controller pushes. Nothing to configure here — the controller decides
      # whether analytics are on at all.
      # Seconds before a Caddy rebuild is abandoned.
      CADDY_BUILD_TIMEOUT: "${CADDY_BUILD_TIMEOUT:-1800}"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - caddy-manager-data:/data
      - .:/compose:ro
      # Caddy's access and WAF logs, which this container is the one that reads.
      - caddy-logs:/logs
      # Country lookups for the events it writes, and where it installs the databases it fetches
      # from the controller. Writable, unlike everywhere else this volume is mounted: on a host
      # that has no geoipupdate of its own, the agent is what puts the files here for Caddy.
      - geoip-data:/usr/share/GeoIP:z
    depends_on:
      caddy:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      # socket-proxy for the Docker API, caddy-network to reach the Caddy admin API it proxies for.
      # The agent already controls that container through Docker, so this grants it nothing new.
      - socket-proxy
      - caddy-network

  # The controller's database. No profile: unlike clickhouse and geoipupdate this is not optional,
  # since SQLite support was removed. Unpublished on purpose — nothing outside the compose network
  # needs it, and publishing 5432 is how a database ends up on the internet.
  postgres:
    container_name: caddy-proxy-manager-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpm}
      POSTGRES_USER: ${POSTGRES_USER:-cpm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERROR - POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpm} -d ${POSTGRES_DB:-cpm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clickhouse:
    container_name: caddy-proxy-manager-clickhouse
    image: clickhouse/clickhouse-server:latest-alpine
    profiles: [clickhouse]
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cpm}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?ERROR - CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/low-disk-write.yml:/etc/clickhouse-server/config.d/low-disk-write.yml:ro
    networks:
      - caddy-network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER:-cpm} --password ${CLICKHOUSE_PASSWORD:?ERROR - CLICKHOUSE_PASSWORD is required} --query 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  geoipupdate:
    container_name: geoipupdate-${HOSTNAME}
    image: ghcr.io/maxmind/geoipupdate
    profiles: [geoipupdate]
    restart: always
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID:-}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY:-}
      - 'GEOIPUPDATE_EDITION_IDS=GeoLite2-ASN GeoLite2-City GeoLite2-Country'
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoip-data:/usr/share/GeoIP:z
    networks:
      - caddy-network

networks:
  caddy-network:
    driver: bridge
  # The agent's route to the Docker API; internal, with no external connectivity.
  socket-proxy:
    driver: bridge
    internal: true

volumes:
  caddy-manager-data:
  caddy-data:
  caddy-config:
  caddy-logs:
  geoip-data:
  clickhouse-data:
  postgres-data:
  acme-ca:
