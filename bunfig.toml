[run]
# equivalent to `bun --bun` for all `bun run` commands
bun = true

[install]
# Isolated (Bun 1.4's workspace default) gives each package only what it
# declares, so a phantom dependency fails at install/typecheck time here rather
# than at runtime on a machine that hoisted differently. Stated explicitly
# because the cost of drifting back to hoisted is silent.
linker = "isolated"

[install.security]
scanner = "@socketsecurity/bun-security-scanner"
