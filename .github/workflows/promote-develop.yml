name: Promote develop to main

# Fast-forwards main to a develop commit once that commit has gone green.
#
# Both CI workflows wake this, so it fires twice per push and each run re-checks the other rather
# than assuming it: whichever finishes first finds the other still running and stops, and the second
# finds both green and promotes. The concurrency group keeps them from racing.
#
# This only works from the default branch — GitHub reads workflow_run definitions from main alone —
# so editing this file on develop has no effect until the change is itself promoted.
on:
  workflow_run:
    workflows: ["Tests", "End-to-end tests"]
    types: [completed]
    branches: [develop]

# Only what the push needs. Nothing here touches a pull request, an issue or a package.
permissions:
  contents: write
  checks: read

concurrency:
  group: promote-develop
  cancel-in-progress: false

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that was tested
        uses: actions/checkout@v7
        with:
          # The tested SHA, not the branch tip: develop may have moved on while CI ran, and
          # promoting a commit that was never tested is the one thing this must not do.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fast-forward main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          REPO: ${{ github.repository }}
          # Mirrors the contexts main's protection requires. Kept here rather than read from the
          # API because the branch-protection endpoint needs admin rights this token does not have.
          REQUIRED_CHECKS: "test e2e"
        run: |
          set -euo pipefail

          # Every gate below refuses on anything it cannot confirm. This job writes to a protected
          # branch, so "unknown" has to mean no.

          permission="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo unknown)"
          if [ "$permission" != "admin" ]; then
            echo "::notice::$ACTOR has '$permission' on this repository; only an admin's push is promoted."
            exit 0
          fi

          # The workflow_run that woke this is green by definition; the other one may still be
          # running, or may have failed. Both are checked against the commit itself.
          for check in $REQUIRED_CHECKS; do
            conclusion="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
              --jq "[.check_runs[] | select(.name == \"$check\")] | sort_by(.completed_at) | last | .conclusion // \"missing\"")"
            if [ "$conclusion" != "success" ]; then
              echo "::notice::'$check' is '$conclusion' on ${SHA:0:8}; leaving main where it is."
              exit 0
            fi
          done

          git fetch --no-tags origin main

          if [ "$(git rev-parse origin/main)" = "$SHA" ]; then
            echo "::notice::main is already at ${SHA:0:8}."
            exit 0
          fi

          # Fast-forward only, for two reasons. A merge commit would be created by this job and so
          # be unsigned, which main's ruleset refuses; and a non-fast-forward push is refused by
          # that same ruleset. If main has drifted, that is a person's problem to resolve.
          if ! git merge-base --is-ancestor origin/main "$SHA"; then
            echo "::warning::main has commits develop does not. Reconcile the two by hand; nothing was promoted."
            exit 0
          fi

          git push origin "$SHA:refs/heads/main"
          echo "::notice::main fast-forwarded to ${SHA:0:8}."
