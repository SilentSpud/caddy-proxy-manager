name: Dependabot auto-merge

on:
  pull_request:
    branches:
      - main
      - develop

# Both scopes are for enabling auto-merge. There is deliberately no approval step: GITHUB_TOKEN
# cannot approve a pull request under any permissions ("GitHub Actions is not permitted to approve
# pull requests"), and main requires no reviews, so there is nothing to approve.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # Hands the PR to GitHub's own auto-merge, which holds it until the checks main
      # requires -- test and e2e -- report success, then squashes. The job finishes in
      # seconds rather than sitting on a runner watching a 14-minute suite.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
