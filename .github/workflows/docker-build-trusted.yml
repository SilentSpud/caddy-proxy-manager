name: Build and Push Docker Images (Trusted)

# Released versions only. The Release workflow creates the v* tag and dispatches this run at it - a
# tag created with GITHUB_TOKEN starts nothing on its own - so the dispatch trigger stays, and the
# gate job below is what refuses any ref that is not a release tag on main.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# One build per ref. Pushing twice in quick succession supersedes the older run
# rather than stacking another 3-image matrix beside it; tags get their own ref
# and so never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release tag gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      newest: ${{ steps.gate.outputs.newest }}
      latest: ${{ steps.gate.outputs.latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag and branch, for the ancestry and ordering checks.
          fetch-depth: 0

      - name: Refuse anything but a release tag on main
        id: gate
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A dispatch on a branch used to publish :<branch> and :sha-* images of unreviewed code.
          if [ "$REF_TYPE" != "tag" ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::images are published only from a vX.Y.Z tag, not ${REF_TYPE} '${TAG}'"
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${TAG} (${GITHUB_SHA}) is not reachable from main"
            exit 1
          fi

          # Only the newest release moves floating tags, so re-dispatching an old one cannot roll
          # :latest or :3 back. versionsort.suffix sorts v3.0.0-rc.3 before v3.0.0.
          newest="$(git -c versionsort.suffix=- tag -l 'v*' --sort=-v:refname | head -n 1)"
          if [ "$TAG" = "$newest" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi

          # docker-compose.yml runs :latest, and 3.0.0 has only prereleases so far, so :latest follows
          # them. Once a stable v3+ tag exists, only stable releases move it.
          stable_exists=false
          if git tag -l 'v*' | grep -v -- '-' | grep -Eq '^v([3-9]|[1-9][0-9]+)\.'; then
            stable_exists=true
          fi
          if [ "$TAG" = "$newest" ] && { [[ "$TAG" != *-* ]] || [ "$stable_exists" = false ]; }; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: "${{ matrix.name }}"
    needs: gate
    runs-on: ubuntu-latest
    # A wedged build step inherits the runner's 6-hour default and burns the
    # whole budget silently. Healthy runs land in a couple of minutes; anything
    # past half an hour is broken, and should fail fast enough to notice.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: Web Dashboard
            service: web
            dockerfile: docker/web/Dockerfile
            context: .
            title: Caddy Proxy Manager Web Dashboard
            description: Web UI and API for managing Caddy reverse proxies, certificates and routes.
          - name: Caddy Handler
            service: caddy
            dockerfile: docker/caddy/Dockerfile
            context: .
            title: Caddy Proxy Manager Caddy Handler
            description: Caddy built with xcaddy, bundling the DNS, layer-4 and WAF plugins Caddy Proxy Manager configures.
          - name: Builder Agent
            service: agent
            dockerfile: docker/agent/Dockerfile
            context: .
            title: Caddy Proxy Manager Builder Agent
            description: Host-side agent that rebuilds the Caddy image and recreates its container on behalf of Caddy Proxy Manager.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Default is `manifest` alone, which annotates the per-arch manifests and leaves the
          # multi-arch index bare - and the index is what GHCR reads for the package page's
          # description and "linked repository". Both levels, so the two agree.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          # Per-image identity. Without these the action derives title and description from the
          # repository, so all three images would claim to be the same thing; the Dockerfiles carry
          # the same values for local `docker compose build`. Everything else - version, revision,
          # created, source, licenses - the action fills in from the tag and the repo.
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=SilentSpud
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=SilentSpud
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
          # The floating tags are the gate's decision, not the action's: its latest=auto would add
          # :latest for any stable semver tag, re-dispatched old ones included.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.gate.outputs.newest == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.gate.outputs.newest == 'true' }}
            type=match,pattern=v(.*),group=1
            type=sha
            type=raw,value=latest,enable=${{ needs.gate.outputs.latest == 'true' }}

      # The tag without its v, baked into the UI and the OpenAPI spec. The gate guarantees a v* tag.
      - name: Compute app version
        id: app-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ steps.app-version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
