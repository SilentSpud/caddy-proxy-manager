name: Build and Push Docker Images (Trusted)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: caddy-proxman

# One build per ref. Pushing twice in quick succession supersedes the older run
# rather than stacking another 3-image matrix beside it; tags get their own ref
# and so never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    # A wedged build step inherits the runner's 6-hour default and burns the
    # whole budget silently. Healthy runs land in a couple of minutes; anything
    # past half an hour is broken, and should fail fast enough to notice.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: Web Dashboard
            service: web
            dockerfile: docker/web/Dockerfile
            context: .
          - name: Caddy Handler
            service: caddy
            dockerfile: docker/caddy/Dockerfile
            context: .
          - name: Layer 4 Port Manager
            service: l4-port-manager
            dockerfile: docker/l4-port-manager/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=match,pattern=v(.*),group=1
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: true
