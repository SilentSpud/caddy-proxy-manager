name: Site

on:
  # Per release, not per push: the docs render the controller's own components live, so a site
  # built on every merge would describe features no published image has yet. The Release workflow
  # dispatches this on main right after it tags - a release created with GITHUB_TOKEN raises no
  # `release` event, and the github-pages environment only deploys from main, so the tag itself is
  # not a ref this can run at. Dispatch it by hand for a docs fix that should not wait for a version.
  workflow_dispatch:

# Least privilege, then the two Pages needs: `pages` to publish and `id-token` for the deployment's
# OIDC exchange. `contents: read` is all the build requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-finished deploy would leave the
# published site inconsistent, and the next release will supersede it anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The oven/bun tag in docker/web and docker/agent, so CI tests what the images build with.
          bun-version: 1.4.2

      # The whole workspace: apps/site is a workspace member, so its dependencies come from the
      # root lockfile rather than one of its own.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the site
        run: bun run --filter @cpm/site build

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
