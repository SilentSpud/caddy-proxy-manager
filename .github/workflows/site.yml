name: Site

on:
  # Per release, not per push: the docs render the controller's own components live, so a site
  # built on every merge would describe features no published image has yet. The Release workflow
  # dispatches this on main right after it tags - a release created with GITHUB_TOKEN raises no
  # `release` event, and the github-pages environment only deploys from main, so the tag itself is
  # not a ref this can run at. Dispatch it by hand for a docs fix that should not wait for a version.
  #
  # A pull request that touches the site or the code it embeds is built and tested, never
  # published, so a broken demo fails there rather than in the next release's deploy. The whole
  # controller `src/` because a demo can reach any of it, and a narrower list would go stale.
  pull_request:
    paths:
      - "apps/site/**"
      - "apps/controller/src/**"
      - "apps/controller/messages/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Least privilege: `contents: read` is all the build requires. The deploy job asks for the two
# Pages needs itself, so a pull request's run never holds them.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The oven/bun tag in docker/web and docker/agent, so CI tests what the images build with.
          bun-version: 1.4.2

      # The whole workspace: apps/site is a workspace member, so its dependencies come from the
      # root lockfile rather than one of its own.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before the build: it is seconds, and a demo copying stale controller data fails here with
      # the field named rather than as a wrong-looking form later.
      - name: Unit tests
        run: bun run --filter @cpm/site test

      - name: Build the site
        run: bun run --filter @cpm/site build

      # From apps/site, the workspace that declares @playwright/test, so bunx resolves the pinned
      # CLI rather than downloading the latest - see the same note in e2e.yml.
      - name: Resolve the Playwright version
        id: playwright
        working-directory: apps/site
        run: echo "version=$(bunx playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/site
        run: bunx playwright install chromium

      # Apt packages outside the cache, so this runs on a hit too; a no-op once present.
      - name: Install Chromium system dependencies
        working-directory: apps/site
        run: bunx playwright install-deps chromium

      # Every demo on every built page hydrates without an error.
      - name: Demo smoke test
        working-directory: apps/site
        run: bunx playwright test

      - name: Upload the artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # `pages` to publish and `id-token` for the deployment's OIDC exchange.
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and never cancel one in flight: a half-finished deploy would leave
    # the published site inconsistent, and the next release will supersede it anyway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
