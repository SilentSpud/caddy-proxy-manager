name: Release

# The version bump is the gate. docker-build-trusted only emits semver tags for a v* ref, so a bump
# that never gets tagged ships as `latest` and nothing else.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  # Skips the version-change check; an already-released version is still a no-op.
  workflow_dispatch:

# Queue rather than cancel: the loser would abandon a version bump with no release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Dispatching the image build — see the last step.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Notes and the deploy-file diff are both computed against the previous release tag.
          fetch-depth: 0

      - name: Resolve the version to release
        id: version
        env:
          # Empty on workflow_dispatch, and all-zero for a new branch; both skip the check below.
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          version="$(jq -er .version package.json)"
          tag="v${version}"

          # A dependency bump touches package.json too, so the release turns on the version having
          # changed across the push — not merely on the file having been written.
          if [ -n "${BEFORE:-}" ] && git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null; then
            before_version="$(git show "${BEFORE}:package.json" 2>/dev/null | jq -er .version 2>/dev/null || true)"
            if [ "$version" = "$before_version" ]; then
              echo "Version unchanged at ${version} — nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # Empty only on a repository with no v* tag yet.
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"

          {
            echo "release=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
            echo "previous=${previous}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag} (prerelease=${prerelease}, previous=${previous:-none})"

      - name: Compose release notes
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # ghcr rejects an uppercase path; metadata-action lowercases the same way at build time.
          image_base="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # What a deployment carries on disk. `docker compose pull` cannot deliver a change to any
          # of these, which is what makes it worth calling out.
          deploy_paths=(docker-compose.yml .env.example docker/clickhouse)

          deploy_changed=""
          if [ -n "$PREVIOUS" ]; then
            deploy_changed="$(git diff --name-only "${PREVIOUS}..HEAD" -- "${deploy_paths[@]}")"
          fi

          {
            echo "## Images"
            echo
            echo '```'
            for service in web caddy agent; do
              echo "${image_base}/${service}:${VERSION}"
            done
            echo '```'
            echo
            echo "Published by the image build this release starts; give it a few minutes. The"
            echo "\`docker-compose.yml\` in the archive below already names these tags, so what you"
            echo "deploy from it stays on this release until you choose to move -- but it also means"
            echo "a \`docker compose pull\` run before the build finishes has nothing to fetch."
            echo
            echo "## Deployment files"
            echo
            if [ -n "$deploy_changed" ]; then
              echo "> [!IMPORTANT]"
              echo "> These live in your checkout, not in the images, so \`docker compose pull\` will"
              echo "> not update them. Pull the repository (or take them from the archive below)"
              echo "> before \`docker compose up -d\`:"
              echo ">"
              while IFS= read -r file; do
                [ -n "$file" ] && echo "> - \`${file}\`"
              done <<< "$deploy_changed"
            elif [ -n "$PREVIOUS" ]; then
              echo "Unchanged since ${PREVIOUS}. Pulling the images is enough."
            else
              echo "First tagged release — take \`docker-compose.yml\` and \`.env.example\` from the archive below."
            fi
            echo
            # The archive is flat and self-contained; say so, and flag both differences from the
            # repository so nobody diffs the two and files a bug.
            echo "The archive holds every file at its top level and deploys as it unpacks —"
            echo "extract it into one directory and \`docker compose up -d\` needs nothing moved."
            echo "Its \`docker-compose.yml\` differs from the copy in the repository in exactly two"
            echo "ways: it mounts the ClickHouse override from beside itself rather than from"
            echo "\`./docker/clickhouse/\`, and it pins the three images to \`${VERSION}\` rather than"
            echo "\`latest\`. The repository copy follows \`latest\` on purpose; this one is a snapshot"
            echo "of one release and says so."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              # Capped; the compare link is the better view of a release that long.
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS}..HEAD" | head -n 100
              total="$(git rev-list --no-merges --count "${PREVIOUS}..HEAD")"
              if [ "$total" -gt 100 ]; then
                echo "- …and $((total - 100)) more"
              fi
              echo
              echo "**Full diff:** https://github.com/${REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            else
              echo "Initial release."
            fi
          } > release-notes.md

          echo "--- release notes ---"
          cat release-notes.md

      - name: Package the deployment files
        id: archive
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # One archive rather than three loose assets. These files are only useful together, and
          # an archive also carries `.env.example` under its real name -- GitHub refuses a leading
          # dot on an asset and was publishing it as `default.env.example`.
          #
          # tar.gz rather than zip: every target platform can open it without extra tooling, since
          # Windows has shipped bsdtar as `tar.exe` in System32 since 1803.
          #
          # Everything sits flat at the archive root, staged here rather than tarred from the
          # checkout. `low-disk-write.yml` says nothing on its own once it is out of the tree, so
          # it carries its directory as a `clickhouse-` prefix instead -- the same rename the
          # `#label` on the old loose asset was doing. Whole directory, not the one file, so a
          # second override added under docker/clickhouse ships without touching this step.
          #
          # A flat archive would leave docker-compose.yml binding a path that is not there, so the
          # staged copy is rewritten to mount the override from beside itself. Only the staged
          # copy: the checkout keeps ./docker/clickhouse/, which is the layout the repo and the
          # e2e stack run from. The result is an archive that deploys as it unpacks -- extract the
          # three files into one directory and `docker compose up -d` needs nothing moved.
          staging="$(mktemp -d)"
          entries=(docker-compose.yml .env.example)
          cp docker-compose.yml .env.example "$staging/"
          for f in docker/clickhouse/*; do
            entry="clickhouse-$(basename "$f")"
            cp "$f" "${staging}/${entry}"
            entries+=("$entry")
          done

          # Host side only. The container side stays /etc/clickhouse-server/config.d/..., which is
          # where ClickHouse actually reads the override from.
          sed -i 's#\./docker/clickhouse/#./clickhouse-#g' "$staging/docker-compose.yml"

          # Pin this release's own images to this release's version.
          #
          # The repository copy tracks `:latest` deliberately -- on main, between releases, that is
          # the tag which exists. But an archive is a snapshot of one release, and shipping it
          # alongside a floating tag meant the two drifted the moment the next release published:
          # someone deploying v3.0.0's files got whatever `latest` had become, and a redeploy months
          # later silently upgraded the containers under compose files that had not changed.
          #
          # Scoped to the three images this project publishes. `tecnativa/docker-socket-proxy:latest`
          # and `clickhouse/clickhouse-server:latest-alpine` are other people's images on their own
          # release cadence, and pinning them to our version would name tags that do not exist --
          # which is what the assertions below are really guarding.
          sed -i -E \
            "s#(image: ghcr\.io/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*/(web|caddy|agent)):latest#\\1:${VERSION}#" \
            "$staging/docker-compose.yml"

          for service in web caddy agent; do
            if ! grep -qE "image: ghcr\.io/.*/${service}:${VERSION}\$" "$staging/docker-compose.yml"; then
              echo "::error::staged docker-compose.yml does not pin ${service} to ${VERSION}"
              grep -n 'image:' "$staging/docker-compose.yml"
              exit 1
            fi
          done

          # A sed that reached too far is the other half of the same worry: the third-party images
          # must still say what they said.
          for untouched in 'tecnativa/docker-socket-proxy:latest' 'clickhouse/clickhouse-server:latest-alpine'; do
            if ! grep -qF "$untouched" "$staging/docker-compose.yml"; then
              echo "::error::staged docker-compose.yml no longer references ${untouched}"
              grep -n 'image:' "$staging/docker-compose.yml"
              exit 1
            fi
          done

          # A sed that matched nothing is the failure worth catching here: it would ship a compose
          # file pointing at a directory the archive does not contain, and nothing downstream
          # would notice until a deploy failed.
          if grep -q 'docker/clickhouse/' "$staging/docker-compose.yml"; then
            echo "::error::staged docker-compose.yml still references docker/clickhouse/"
            grep -n 'docker/clickhouse/' "$staging/docker-compose.yml"
            exit 1
          fi
          for entry in "${entries[@]}"; do
            case "$entry" in
              clickhouse-*)
                if ! grep -q "\./${entry}:" "$staging/docker-compose.yml"; then
                  echo "::error::staged docker-compose.yml does not mount ${entry}"
                  exit 1
                fi
                ;;
            esac
          done

          name="caddy-proxy-manager-${TAG}-deploy.tar.gz"
          tar -czf "$name" -C "$staging" "${entries[@]}"

          # The dotfile is half the reason this is an archive, so it is worth asserting rather
          # than trusting: tar stores the name it was given, but a release that quietly shipped
          # `.env.example` under some other name would look fine until someone tried to deploy.
          for want in docker-compose.yml .env.example clickhouse-low-disk-write.yml; do
            if ! tar -tzf "$name" | grep -qxF "$want"; then
              echo "::error::${name} is missing ${want}"
              tar -tzf "$name"
              exit 1
            fi
          done

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "--- archive contents ---"
          tar -tzvf "$name"

      - name: Create the tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARCHIVE: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail

          args=(
            "$TAG"
            --title "$TAG"
            --notes-file release-notes.md
            # The checked-out commit, not wherever the branch moved while the run queued.
            --target "$GITHUB_SHA"
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          args+=( "$ARCHIVE" )

          gh release create "${args[@]}"

      - name: Build and publish the images for this tag
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Dispatched, not left to the tag push: a tag created with GITHUB_TOKEN starts no
          # workflow, and workflow_dispatch is the documented exception. --ref so metadata-action
          # reads the version off the tag.
          gh workflow run docker-build-trusted.yml --ref "$TAG"
          echo "Dispatched docker-build-trusted at ${TAG}"
