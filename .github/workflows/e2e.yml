name: End-to-end tests

on:
  # Pull requests only. This suite builds the whole Compose stack and runs single-worker against a
  # live Caddy, so it is the expensive check by a wide margin - running it on every push to a work
  # branch spends that on commits nobody is ready to merge, and running it again on the push to main
  # re-proved a tree the pull request had already tested. The run against the merge result is the
  # one that decides whether the code lands, and it is the one kept.
  pull_request:
    branches:
      - main

# One run per ref. A force-push supersedes the in-flight run rather than leaving
# a 30-minute Docker job grinding against a commit nobody is looking at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # tests/global-setup.ts allows 180s for the stack to come up and the suite
    # itself runs single-worker against a live Caddy, so this is slow by nature.
    # Healthy runs land around 15-20 minutes; past 45 something is wedged.
    timeout-minutes: 45
    # The suite builds images and drives a local stack. No package pushes, no
    # repo writes, and no secrets: references, so nothing is injected here.
    permissions:
      contents: read

    env:
      # Single source of truth for the browser set: the install step and the cache
      # key both read it, so adding a browser here misses the cache and downloads
      # it rather than restoring a bundle that is missing it.
      #
      # chromium for the desktop project, webkit for mobile-iphone: devices
      # ['iPhone 15'] carries defaultBrowserType "webkit", so omitting it fails
      # only the mobile project, and only once it reaches a test.
      PLAYWRIGHT_BROWSERS: chromium webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The oven/bun tag in docker/web and docker/agent, so CI tests what the images build with.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Browser builds are pinned to the Playwright release, so the version is the
      # whole cache key beyond the browser set. No restore-keys prefix: a partial
      # hit would leave browsers from another release in place and the install step
      # below would skip over them.
      #
      # Every playwright step below runs from apps/controller, which is the workspace
      # that declares @playwright/test, so bunx resolves the pinned CLI. From the repo
      # root it resolves nothing locally and downloads the latest from npm instead -
      # which installed 1.63.0's browsers for a suite running 1.62.1, leaving the
      # tests looking for a revision that was never downloaded. Do not "simplify"
      # these back to the root.
      - name: Resolve the Playwright browser cache key
        id: playwright
        working-directory: apps/controller
        run: |
          echo "version=$(bunx playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
          echo "browsers=$(echo "$PLAYWRIGHT_BROWSERS" | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/controller
        run: bunx playwright install $PLAYWRIGHT_BROWSERS

      # The shared libraries --with-deps pulls in are apt packages outside
      # ~/.cache/ms-playwright, so the cache cannot carry them and this runs on a
      # hit too. It is a no-op once they are present.
      - name: Install Playwright system dependencies
        working-directory: apps/controller
        run: bunx playwright install-deps $PLAYWRIGHT_BROWSERS

      # The default docker driver cannot export build cache, so type=gha in
      # tests/docker-compose.ci.yml needs a real buildx builder to exist first.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # tests/global-setup.ts drives `docker compose up -d --build` over
      # docker-compose.yml + tests/docker-compose.test.yml, seeds fixtures, logs
      # in, and saves the storage state the projects reuse. Teardown removes the
      # stack, so there is nothing to clean up after this step.
      - name: Run Playwright end-to-end suite
        run: bun run test:e2e
        env:
          # Layers the GHA cache config onto the stack. tests/helpers/compose.ts adds it as one
          # more -f; nothing outside CI sets this, so a local run is unchanged.
          E2E_COMPOSE_EXTRA_FILE: apps/controller/tests/docker-compose.ci.yml
          # Compose only honours build.cache_to when it delegates the build to bake.
          COMPOSE_BAKE: "true"

      - name: Upload failure artifacts
        # Only on failure: traces and the per-test error-context.md snapshots are
        # what make a red run diagnosable without reproducing it locally, and a
        # green run's copies are noise.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
