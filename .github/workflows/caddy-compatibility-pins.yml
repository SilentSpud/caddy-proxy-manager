name: Refresh Caddy compatibility pins

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docker/caddy/go.mod

      - name: Refresh Caddy compatibility replacement
        run: sh docker/caddy/update-compatibility-pins.sh

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- docker/caddy/go.mod docker/caddy/go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updated Caddy image
        if: steps.changes.outputs.changed == 'true'
        # Compose interpolates the whole file before it builds anything, and
        # docker-compose.yml declares these two with `:?`. A runner has no .env, so without
        # them this aborts before the caddy build it is meant to verify. Values are never
        # used -- nothing here starts a container. Keep this list in step with every `:?` in
        # docker-compose.yml: the step only runs when the pins move, so a missing one stays
        # hidden behind weeks of green "no changes" runs.
        env:
          SESSION_SECRET: pin-verify-interpolation-placeholder
          POSTGRES_PASSWORD: pin-verify-interpolation-placeholder
        run: docker compose build caddy

      # Opened with GITHUB_TOKEN, and nothing that token does starts a workflow: test and e2e never
      # run on this PR by themselves, so auto-merge would wait forever. Close and reopen it (or push
      # to the branch) as a maintainer to run the checks main requires. No PAT, by design.
      - name: Open compatibility-pin pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/caddy-compatibility-pins"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add docker/caddy/go.mod docker/caddy/go.sum
          git commit -m "caddy: refresh compatibility pins"
          git push --force origin "$branch"
          if ! gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$branch" \
              --title "caddy: refresh compatibility pins" \
              --body "Automated compatibility-pin refresh derived from the pinned Caddy module. The Caddy image build passed before this PR was opened."
          fi
