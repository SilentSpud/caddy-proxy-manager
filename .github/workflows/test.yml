name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # Zero out GITHUB_TOKEN permissions — tests need no credentials. No secrets:
    # references in this workflow either, so no repo secrets are injected into the
    # environment. The postgres service below is a throwaway container on the
    # runner, reachable only from this job.
    permissions: {}

    # PostgreSQL is a supported backend, so it gets exercised rather than assumed.
    # tests/integration/db-backend.test.ts runs its checks against this server when
    # TEST_POSTGRES_URL is set, and silently covers SQLite only when it is not.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cpm
          POSTGRES_PASSWORD: cpm-ci
          POSTGRES_DB: cpm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpm -d cpm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # A real OIDC provider for tests/integration/oauth-flow.test.ts. OAuth is the one auth path
      # the fast suite cannot otherwise reach — the unit tests stub betterAuth outright — and a
      # broken callback previously only surfaced in the end-to-end suite, after the push.
      # interactiveLogin:false makes /authorize issue a code directly, so no browser is involved.
      # Keep JSON_CONFIG in step with MOCK_IDP_JSON_CONFIG in tests/helpers/mock-idp.ts.
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        env:
          JSON_CONFIG: '{"interactiveLogin":false,"httpServer":"NettyWrapper","tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"grant_type","match":"authorization_code","claims":{"sub":"test-oauth-user","email":"oauth@test.local","email_verified":true,"name":"Test OAuth User","role":"admin"}}]}]}'
        ports:
          - 5599:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome covers both linting and formatting, so an unformatted file fails
      # here rather than drifting until someone notices. `biome check` exits
      # non-zero only on errors, so the remaining warnings stay advisory.
      - name: Lint and format check
        run: bun run lint

      - name: Type-check clean dependency graph
        run: bun run typecheck

      # Coverage is collected here rather than in a separate job so the
      # thresholds in scripts/coverage-ratchet.ts actually gate a pull request:
      # the step fails if coverage drops below the ratchet.
      # The IdP has no health check of its own, and the OAuth test skips when it cannot reach one.
      # Wait for it explicitly so a container that failed to start fails the job instead of quietly
      # dropping that coverage.
      - name: Wait for the mock OIDC provider
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5599/default/.well-known/openid-configuration > /dev/null; then
              echo "mock-oidc ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "mock-oidc did not become ready"; exit 1

      - name: Run unit and integration tests with coverage
        env:
          TEST_POSTGRES_URL: postgres://cpm:cpm-ci@127.0.0.1:5432/cpm_test
          TEST_OIDC_URL: http://localhost:5599
        run: bun run test:coverage

      - name: Upload coverage report
        # Always: a threshold failure is exactly when the per-file breakdown in
        # coverage/lcov.info is worth reading.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build production application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_PATH: /tmp/caddy-proxy-manager-build.db
          DATABASE_URL: file:/tmp/caddy-proxy-manager-build.db
          SESSION_SECRET: ci-build-session-secret-at-least-32-chars
          ADMIN_PASSWORD: ci-build-admin-password
        run: bun run build
