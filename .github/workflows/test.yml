name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    # Zero out GITHUB_TOKEN permissions — tests have no external dependencies and
    # need no credentials. No secrets: references in this workflow either, so no
    # repo secrets are injected into the environment.
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Coverage is collected here rather than in a separate job so the
      # thresholds in tests/vitest.config.ts actually gate a pull request: the
      # step fails if coverage drops below the ratchet.
      - name: Run unit and integration tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        # Always: a threshold failure is exactly when the line-by-line HTML
        # report is worth reading.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
