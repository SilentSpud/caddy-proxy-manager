name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    # Zero out GITHUB_TOKEN permissions — tests have no external dependencies and
    # need no credentials. No secrets: references in this workflow either, so no
    # repo secrets are injected into the environment.
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Biome covers both linting and formatting, so an unformatted file fails
      # here rather than drifting until someone notices. `biome check` exits
      # non-zero only on errors, so the remaining warnings stay advisory.
      - name: Lint and format check
        run: bun run lint

      # Coverage is collected here rather than in a separate job so the
      # thresholds in scripts/coverage-ratchet.ts actually gate a pull request:
      # the step fails if coverage drops below the ratchet.
      - name: Run unit and integration tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        # Always: a threshold failure is exactly when the per-file breakdown in
        # coverage/lcov.info is worth reading.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
