# Reaching the controller over a tailnet, for an agent on a host the controller cannot route to.
#
# Overlay, not a replacement:
#
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#
# The sidecar joins the *agent's* network namespace rather than the other way round. That is the
# whole trick: the agent keeps its place on the compose network — it still resolves `caddy` and
# `docker-socket-proxy` by service name — and gains tailnet routing and MagicDNS on top. Putting
# the agent into the sidecar's namespace instead would take those service names away and break
# every Caddy admin call it proxies.
#
# Works the same against Headscale; point `TS_EXTRA_ARGS` at your own control server. See
# "Connecting agents over Tailscale or Headscale" in the README for how to address the controller.

services:
  tailscale-agent:
    image: tailscale/tailscale:latest
    container_name: caddy-proxy-manager-tailscale
    restart: unless-stopped
    # Joins the agent's namespace. Compose starts the agent first because of this.
    network_mode: service:agent
    environment:
      # An auth key from the Tailscale admin console, or `headscale preauthkeys create`. Prefer an
      # ephemeral, pre-approved key: this node is a container that will be recreated.
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-cpm-agent}
      TS_STATE_DIR: /var/lib/tailscale
      # A real tun device rather than userspace networking, so the agent's own fetch() reaches the
      # tailnet without a proxy env var. Needs the capabilities and the device below.
      TS_USERSPACE: "false"
      # Headscale: TS_EXTRA_ARGS: --login-server=https://headscale.example.com
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale-agent-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  agent:
    environment:
      # The controller as this tailnet sees it. Any of these work:
      #   http://cpm-controller:3000                     MagicDNS name, controller serving plainly
      #   http://100.98.59.37:3000                       tailnet IP, no DNS needed
      #   https://cpm-controller.tailnet-1234.ts.net     behind `tailscale serve` on 443
      CONTROLLER_URL: ${CONTROLLER_URL:?set CONTROLLER_URL to the controller's tailnet address}
      # Only for a control server using a private CA — Headscale with your own certificates, or a
      # reverse proxy in front of the controller. Mount the CA and point this at it.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}

volumes:
  tailscale-agent-state:
